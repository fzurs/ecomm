name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4.12-alpine
        ports: ["6379:6379"]
    env:
      # There's no ARCA certificate here to read it from (billing.arca.issuer_cuit). Fictitious.
      ARCA_CUIT: "20123456786"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      # The settings' defaults reach these services on localhost, like the devcontainer.
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - name: Production settings (admin only)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          STORE_ENABLED: "false"
          ALLOWED_HOSTS: api
          EMAIL_URL: consolemail://
          DEFAULT_FROM_EMAIL: ci@example.com
          MEDIA_URL: https://media.example.com/
          ARCA_ENVIRONMENT: produccion
          ARCA_CERTIFICATE_PATH: ${{ runner.temp }}/ecomm.crt
          ARCA_PRIVATE_KEY_PATH: ${{ runner.temp }}/ecomm.key
          R2_ACCOUNT_ID: ci
          R2_BUCKET: ci
          R2_ACCESS_KEY_ID: ci
          R2_SECRET_ACCESS_KEY: ci
        run: |
          touch "$ARCA_CERTIFICATE_PATH" "$ARCA_PRIVATE_KEY_PATH"
          SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(50))") \
            python manage.py check --deploy --fail-level WARNING

  frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build apps/api
      - run: >-
          docker build -f apps/admin/Dockerfile
          --build-arg API_URL=http://api:8000 --build-arg MEDIA_URL=https://media.example.com/ .
      - run: docker build deploy/backup
      - name: Compose file
        run: |
          sudo mkdir -p /etc/ecomm
          sudo touch /etc/ecomm/{db,api,cloudflared,backup}.env
          MEDIA_URL=https://media.example.com/ docker compose -f deploy/compose.yml config --quiet

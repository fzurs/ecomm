version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspace/ecomm
      - ../../arca-client:/workspace/arca-client:ro
      # Persists VS Code extensions across rebuilds.
      - vscode-extensions:/home/vscode/.vscode-server/extensions

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    # Pinned to the major the postgres-data volume was initialized with.
    image: postgres:18
    restart: unless-stopped
    # Dev only: trades crash durability for speed (test DB setup, migrations). A hard crash can lose data.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres

    # Add "forwardPorts": [5432] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

    # Shares the network with db/api so Django reaches it at redis://127.0.0.1:6379.
    network_mode: service:db

volumes:
  postgres-data:
  redis-data:
  vscode-extensions:
